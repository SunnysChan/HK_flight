name: Auto Run Python Script

on:
  # Triggers the script every day at midnight UTC
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies (optional)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Python script
        run: python main.py

      - name: Commit and Push Generated File
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add flights.json
          git commit -m "chore: auto-update generated report.txt" || echo "No changes to commit"
          git push
