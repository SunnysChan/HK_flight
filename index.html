<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Data Table</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f6f9; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <h2>Flight Count</h2>

    <h3>Filtered ICAO Codes:</h3>
    <div id="output">Loading data...</div>
    
    <table id="flight-table">
        <thead>
            <tr><th>Name</th><th>ICAO</th><th>IATA</th><th>Count</th></tr>
        </thead>
        <tbody>
            <!-- Data will be inserted here dynamically -->
        </tbody>
    </table>

    <script>
        // Fetch the flights.json file from the same directory
        fetch('flights.json')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('#flight-table tbody');
                
                // Loop through the 2D array rows
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    
                    // Loop through the items in each row (up to 4 columns A, B, C, D)
                    row.forEach(cellText => {
                        const td = document.createElement('td');
                        td.textContent = cellText;
                        tr.appendChild(td);
                    });
                    
                    tbody.appendChild(tr);
                });

                // Get ICAO list
                try {
                    const outputElement = document.getElementById('output');
                    // Filter and Map logic:
                    // 1. Filter: ICAO code is not "///" AND flight count > 4
                    // 2. Slice: Take only the first 20 results
                    // 3. Map: Extract only the ICAO code (index 1 of the inner array)
                    const filteredICAOs = data
                        .filter(i => i[1] !== "///" && i[3] >= 4)
                        .slice(0, 30)
                        .map(i => i[1]);
    
                    // Join by comma without spaces
                    const resultText = filteredICAOs.join(',');
    
                    // Display the result
                    outputElement.textContent = resultText || "No airports matched the criteria.";
    
                } catch (error) {
                    console.error(error);
                    outputElement.textContent = "Error loading data: " + error.message;
                };
            })
            .catch(error => console.error('Error loading flight data:', error));
    </script>

</body>
</html>
